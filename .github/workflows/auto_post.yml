name: Auto Post Video Tweet

on:
  schedule:
    - cron: '0 */2 * * *'  # Runs every 2 hours
  workflow_dispatch:      # Allows manual triggering

jobs:
  post-tweet:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Create .env file
      run: |
        echo "BEARER_TOKEN=${{ secrets.BEARER_TOKEN }}" >> .env
        echo "API_KEY=${{ secrets.API_KEY }}" >> .env
        echo "API_SECRET=${{ secrets.API_SECRET }}" >> .env
        echo "ACCESS_TOKEN=${{ secrets.ACCESS_TOKEN }}" >> .env
        echo "ACCESS_TOKEN_SECRET=${{ secrets.ACCESS_TOKEN_SECRET }}" >> .env

    - name: Create youtube_cookies.txt
      run: |
        echo "${{ secrets.YOUTUBE_COOKIES }}" > youtube_cookies.txt

    - name: Run bot
      run: python main.py

    - name: Commit and push changes
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git add usedVideo.txt
        # Check if there are changes to commit
        if ! git diff --cached --quiet; then
          git commit -m "chore: Update usedVideo.txt [skip ci]"
          git push origin main
        else
          echo "No changes to commit"
        fi
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
